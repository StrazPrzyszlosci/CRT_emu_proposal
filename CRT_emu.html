<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post-Processing Enhanced Pixel Art Renderer</title>
    <style>
        canvas {
            display: block;
            margin: 0 auto;
            background: black;
        }
        #fileInput {
            display: block;
            margin: 20px auto;
            text-align: center;
        }
        #log {
            margin: 20px auto;
            text-align: center;
            color: white;
            background: black;
            padding: 10px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <input type="file" id="fileInput" accept="image/*">
    <canvas id="canvas"></canvas>
    <canvas id="originalCanvas" style="display:none;"></canvas>
    <canvas id="postProcessCanvas"></canvas>
    <div id="log"></div>

    <script id="vertexShader" type="x-shader/x-vertex">
        attribute vec2 a_position;
        varying vec2 v_texCoord;

        void main() {
            gl_Position = vec4(a_position, 0.0, 1.0);
            v_texCoord = a_position * 0.5 + 0.5;
        }
    </script>

    <script id="fragmentShader" type="x-shader/x-fragment">
    precision highp float;

    uniform sampler2D u_image;
    uniform vec2 u_resolution;
    uniform vec2 u_pixelSize;
    uniform float u_glowAmount;
    uniform float u_contrast;
    uniform float u_blurAmount;
    uniform float u_brightness; // Nowy uniform dla kontroli jasności
    varying vec2 v_texCoord;

    const float SCANLINES_STRENGTH = 0.65;
    const float SCANLINES_FREQUENCY = 120.0;

    vec3 applyBlur(sampler2D tex, vec2 uv) {
        vec3 color = vec3(0.0);
        vec2 tex_size = u_resolution;
        vec2 one = 1.0 / tex_size;

        vec2 offsets[25];
        offsets[0] = vec2(-2.0, -2.0); offsets[1] = vec2(-1.0, -2.0); offsets[2] = vec2(0.0, -2.0); offsets[3] = vec2(1.0, -2.0); offsets[4] = vec2(2.0, -2.0);
        offsets[5] = vec2(-2.0, -1.0); offsets[6] = vec2(-1.0, -1.0); offsets[7] = vec2(0.0, -1.0); offsets[8] = vec2(1.0, -1.0); offsets[9] = vec2(2.0, -1.0);
        offsets[10] = vec2(-2.0, 0.0); offsets[11] = vec2(-1.0, 0.0); offsets[12] = vec2(0.0, 0.0); offsets[13] = vec2(1.0, 0.0); offsets[14] = vec2(2.0, 0.0);
        offsets[15] = vec2(-2.0, 1.0); offsets[16] = vec2(-1.0, 1.0); offsets[17] = vec2(0.0, 1.0); offsets[18] = vec2(1.0, 1.0); offsets[19] = vec2(2.0, 1.0);
        offsets[20] = vec2(-2.0, 2.0); offsets[21] = vec2(-1.0, 2.0); offsets[22] = vec2(0.0, 2.0); offsets[23] = vec2(1.0, 2.0); offsets[24] = vec2(2.0, 2.0);

        float weights[25];
        weights[0] = 0.003; weights[1] = 0.013; weights[2] = 0.022; weights[3] = 0.013; weights[4] = 0.003;
        weights[5] = 0.013; weights[6] = 0.059; weights[7] = 0.097; weights[8] = 0.059; weights[9] = 0.013;
        weights[10] = 0.022; weights[11] = 0.097; weights[12] = 0.159; weights[13] = 0.097; weights[14] = 0.022;
        weights[15] = 0.013; weights[16] = 0.059; weights[17] = 0.097; weights[18] = 0.059; weights[19] = 0.013;
        weights[20] = 0.003; weights[21] = 0.013; weights[22] = 0.022; weights[23] = 0.013; weights[24] = 0.003;

        float kernel_sum = 0.0;

        for (int i = 0; i < 25; ++i) {
            vec2 offsetCoord = uv + offsets[i] * one * u_blurAmount;
            color += texture2D(tex, offsetCoord).rgb * weights[i];
            kernel_sum += weights[i];
        }

        return color / kernel_sum;
    }

    vec3 applyScanlines(vec3 color, vec2 uv) {
        float scanline = sin(uv.y * SCANLINES_FREQUENCY * 3.14159265358979);
        color *= 1.0 - pow(SCANLINES_STRENGTH, 2.0) * scanline;
        return color;
    }

 void main() {
    vec2 uv = vec2(v_texCoord.x, 1.0 - v_texCoord.y);

    vec3 blurredColor = applyBlur(u_image, uv);
    vec3 scanlinedColor = applyScanlines(blurredColor, uv);
    scanlinedColor = mix(vec3(0.5), scanlinedColor, u_contrast);

    // Zastosuj kontrolę jasności
    scanlinedColor *= u_brightness;

    gl_FragColor = vec4(scanlinedColor, 1.0);
}
    </script>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const canvas = document.getElementById("canvas");
        const originalCanvas = document.getElementById("originalCanvas");
        const postProcessCanvas = document.getElementById("postProcessCanvas");
        const logDiv = document.getElementById("log");
        const gl = canvas.getContext("webgl");

        const SCANLINES_FREQUENCY = 120.0;

        function createShader(gl, type, source) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                console.error(gl.getShaderInfoLog(shader));
                logDiv.innerHTML += `<p>Error compiling shader: ${gl.getShaderInfoLog(shader)}</p>`;
                gl.deleteShader(shader);
                return null;
            }
            return shader;
        }

        function createProgram(gl, vertexShader, fragmentShader) {
            const program = gl.createProgram();
            gl.attachShader(program, vertexShader);
            gl.attachShader(program, fragmentShader);
            gl.linkProgram(program);
            if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
                console.error(gl.getProgramInfoLog(program));
                logDiv.innerHTML += `<p>Error linking program: ${gl.getProgramInfoLog(program)}</p>`;
                gl.deleteProgram(program);
                return null;
            }
            return program;
        }

const SCANLINES_STRENGTH = 0.65;

function estimateScanlineWidth(height) {
    return Math.round(height / SCANLINES_FREQUENCY);
}

function removeScanlines(ctx, width, height) {
    const imageData = ctx.getImageData(0, 0, width, height);
    const data = imageData.data;

    const scanlineWidth = Math.round(height / SCANLINES_FREQUENCY);
    let maxBrightness = 0;

    // Znajdź maksymalną jasność
    for (let y = 0; y < height; y++) {
        const uv_y = y / height;
        const scanline = Math.sin(uv_y * SCANLINES_FREQUENCY * Math.PI);
        const scanlineEffect = 1.0 - Math.pow(SCANLINES_STRENGTH, 2.0) * scanline;
        maxBrightness = Math.max(maxBrightness, scanlineEffect);
    }

    for (let y = 0; y < height; y++) {
        const uv_y = y / height;
        const scanline = Math.sin(uv_y * SCANLINES_FREQUENCY * Math.PI);
        const scanlineEffect = 1.0 - Math.pow(SCANLINES_STRENGTH, 2.0) * scanline;

        // Wzmocniona korekcja jasności
        const brightnessCorrection = Math.pow(maxBrightness / scanlineEffect, 1.5);

        for (let x = 0; x < width; x++) {
            const i = (y * width + x) * 4;
            for (let c = 0; c < 3; c++) {
                data[i + c] = Math.min(255, Math.round(data[i + c] * brightnessCorrection));
            }
        }
    }

    ctx.putImageData(imageData, 0, 0);
}
function equalizeBrightness(ctx, width, height) {
    const imageData = ctx.getImageData(0, 0, width, height);
    const data = imageData.data;
    const avgBrightness = new Array(height).fill(0);

    // Oblicz średnią jasność dla każdego wiersza
    for (let y = 0; y < height; y++) {
        let rowSum = 0;
        for (let x = 0; x < width; x++) {
            const i = (y * width + x) * 4;
            rowSum += (data[i] + data[i + 1] + data[i + 2]) / 3;
        }
        avgBrightness[y] = rowSum / width;
    }

    // Wyrównaj jasność
    const targetBrightness = Math.max(...avgBrightness);
    for (let y = 0; y < height; y++) {
        const factor = targetBrightness / avgBrightness[y];
        for (let x = 0; x < width; x++) {
            const i = (y * width + x) * 4;
            for (let c = 0; c < 3; c++) {
                data[i + c] = Math.min(255, Math.round(data[i + c] * factor));
            }
        }
    }

    ctx.putImageData(imageData, 0, 0);
}

function applyAdaptiveHorizontalBlur(ctx, width, height) {
    const imageData = ctx.getImageData(0, 0, width, height);
    const data = imageData.data;
    const tempData = new Uint8ClampedArray(data);

    for (let y = 0; y < height; y++) {
        const uv_y = y / height;
        const scanline = Math.abs(Math.sin(uv_y * SCANLINES_FREQUENCY * Math.PI));
        const blurRadius = Math.ceil(scanline * 3); // Zmniejszony promień rozmycia

        for (let x = 0; x < width; x++) {
            let r = 0, g = 0, b = 0, weightSum = 0;

            for (let dx = -blurRadius; dx <= blurRadius; dx++) {
                const nx = Math.min(Math.max(x + dx, 0), width - 1);
                const weight = blurRadius - Math.abs(dx) + 1;
                const i = (y * width + nx) * 4;
                r += tempData[i] * weight;
                g += tempData[i + 1] * weight;
                b += tempData[i + 2] * weight;
                weightSum += weight;
            }

            const i = (y * width + x) * 4;
            data[i] = r / weightSum;
            data[i + 1] = g / weightSum;
            data[i + 2] = b / weightSum;
        }
    }

    ctx.putImageData(imageData, 0, 0);
}
function applySubpixelization(ctx, width, height, subpixelSize = 3) {
    const imageData = ctx.getImageData(0, 0, width, height);
    const data = imageData.data;

    for (let y = 0; y < height; y += subpixelSize) {
        for (let x = 0; x < width; x += subpixelSize) {
            let r = 0, g = 0, b = 0;
            let count = 0;

            // Oblicz średni kolor dla subpiksela
            for (let sy = 0; sy < subpixelSize && y + sy < height; sy++) {
                for (let sx = 0; sx < subpixelSize && x + sx < width; sx++) {
                    const i = ((y + sy) * width + (x + sx)) * 4;
                    r += data[i];
                    g += data[i + 1];
                    b += data[i + 2];
                    count++;
                }
            }

            r = Math.round(r / count);
            g = Math.round(g / count);
            b = Math.round(b / count);

            // Zastosuj subpikselizację
            for (let sy = 0; sy < subpixelSize && y + sy < height; sy++) {
                for (let sx = 0; sx < subpixelSize && x + sx < width; sx++) {
                    const i = ((y + sy) * width + (x + sx)) * 4;
                    data[i] = r;
                    data[i + 1] = g;
                    data[i + 2] = b;
                }
            }
        }
    }

    ctx.putImageData(imageData, 0, 0);
}

function applySubtleLocalContrast(ctx, width, height, radius = 5, amount = 0.1) {
    const imageData = ctx.getImageData(0, 0, width, height);
    const data = imageData.data;
    const tempData = new Uint8ClampedArray(data);

    for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
            let totalR = 0, totalG = 0, totalB = 0, count = 0;

            for (let dy = -radius; dy <= radius; dy++) {
                for (let dx = -radius; dx <= radius; dx++) {
                    const nx = Math.min(Math.max(x + dx, 0), width - 1);
                    const ny = Math.min(Math.max(y + dy, 0), height - 1);
                    const i = (ny * width + nx) * 4;
                    totalR += tempData[i];
                    totalG += tempData[i + 1];
                    totalB += tempData[i + 2];
                    count++;
                }
            }

            const i = (y * width + x) * 4;
            const avgR = totalR / count;
            const avgG = totalG / count;
            const avgB = totalB / count;

            // Subtelne zwiększenie kontrastu
            data[i] = Math.min(255, Math.max(0, tempData[i] + (tempData[i] - avgR) * amount));
            data[i + 1] = Math.min(255, Math.max(0, tempData[i + 1] + (tempData[i + 1] - avgG) * amount));
            data[i + 2] = Math.min(255, Math.max(0, tempData[i + 2] + (tempData[i + 2] - avgB) * amount));
        }
    }

    ctx.putImageData(imageData, 0, 0);
}
function applySmartSharpening(ctx, width, height, amount = 0.5) {
    const imageData = ctx.getImageData(0, 0, width, height);
    const data = imageData.data;
    const tempData = new Uint8ClampedArray(data);

    const scanlineWidth = Math.round(height / SCANLINES_FREQUENCY);

    for (let y = 1; y < height - 1; y++) {
        for (let x = 1; x < width - 1; x++) {
            const i = (y * width + x) * 4;

            // Oblicz wagę wyostrzania bazując na pozycji względem scanlines
            const scanlinePosition = y % scanlineWidth;
            const scanlineWeight = Math.sin((scanlinePosition / scanlineWidth) * Math.PI);
            const sharpWeight = amount * (1 - scanlineWeight);

            for (let c = 0; c < 3; c++) {
                const current = tempData[i + c];
                const top = tempData[i - width * 4 + c];
                const bottom = tempData[i + width * 4 + c];
                const left = tempData[i - 4 + c];
                const right = tempData[i + 4 + c];

                // Oblicz różnicę między pikselami
                const diff = 4 * current - top - bottom - left - right;

                // Zastosuj wyostrzanie z adaptacyjną wagą
                data[i + c] = Math.min(255, Math.max(0, current + diff * sharpWeight));
            }
        }
    }

    ctx.putImageData(imageData, 0, 0);
}

function enhanceDetails(ctx, width, height) {
    const imageData = ctx.getImageData(0, 0, width, height);
    const data = imageData.data;
    const tempData = new Uint8ClampedArray(data);

    // Maska do wykrywania krawędzi
    const edgeMask = [
        [-1, -1, -1],
        [-1,  8, -1],
        [-1, -1, -1]
    ];

    for (let y = 1; y < height - 1; y++) {
        for (let x = 1; x < width - 1; x++) {
            const i = (y * width + x) * 4;
            let edgeR = 0, edgeG = 0, edgeB = 0;

            // Aplikuj maskę do wykrywania krawędzi
            for (let ky = -1; ky <= 1; ky++) {
                for (let kx = -1; kx <= 1; kx++) {
                    const idx = ((y + ky) * width + (x + kx)) * 4;
                    const weight = edgeMask[ky + 1][kx + 1];
                    edgeR += tempData[idx] * weight;
                    edgeG += tempData[idx + 1] * weight;
                    edgeB += tempData[idx + 2] * weight;
                }
            }

            // Normalizuj i dodaj do oryginalnego koloru
            const factor = 0.5; // Możesz dostosować tę wartość
            data[i] = Math.min(255, Math.max(0, tempData[i] + edgeR * factor));
            data[i + 1] = Math.min(255, Math.max(0, tempData[i + 1] + edgeG * factor));
            data[i + 2] = Math.min(255, Math.max(0, tempData[i + 2] + edgeB * factor));
        }
    }

    ctx.putImageData(imageData, 0, 0);
}

function applyUnsharpMask(ctx, width, height, amount = 0.5, radius = 1, threshold = 4) {
    const imageData = ctx.getImageData(0, 0, width, height);
    const data = imageData.data;
    const blurredData = new Uint8ClampedArray(data);

    // Najpierw zastosuj rozmycie gaussowskie
    for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
            let r = 0, g = 0, b = 0, count = 0;
            for (let dy = -radius; dy <= radius; dy++) {
                for (let dx = -radius; dx <= radius; dx++) {
                    const nx = Math.min(Math.max(x + dx, 0), width - 1);
                    const ny = Math.min(Math.max(y + dy, 0), height - 1);
                    const i = (ny * width + nx) * 4;
                    r += data[i];
                    g += data[i + 1];
                    b += data[i + 2];
                    count++;
                }
            }
            const i = (y * width + x) * 4;
            blurredData[i] = r / count;
            blurredData[i + 1] = g / count;
            blurredData[i + 2] = b / count;
        }
    }

    // Teraz zastosuj unsharp mask
    for (let i = 0; i < data.length; i += 4) {
        for (let c = 0; c < 3; c++) {
            const diff = data[i + c] - blurredData[i + c];
            if (Math.abs(diff) > threshold) {
                data[i + c] = Math.min(255, Math.max(0, data[i + c] + diff * amount));
            }
        }
    }

    ctx.putImageData(imageData, 0, 0);
}
function applyIntelligentUpscaling(ctx, width, height, scaleFactor) {
    const originalImageData = ctx.getImageData(0, 0, width, height);
    const originalData = originalImageData.data;

    const newWidth = width * scaleFactor;
    const newHeight = height * scaleFactor;

    const newImageData = ctx.createImageData(newWidth, newHeight);
    const newData = newImageData.data;

    for (let y = 0; y < newHeight; y++) {
        for (let x = 0; x < newWidth; x++) {
            const srcX = x / scaleFactor;
            const srcY = y / scaleFactor;

            const x1 = Math.floor(srcX);
            const y1 = Math.floor(srcY);
            const x2 = Math.min(x1 + 1, width - 1);
            const y2 = Math.min(y1 + 1, height - 1);

            const fracX = srcX - x1;
            const fracY = srcY - y1;

            const index = (y * newWidth + x) * 4;

            for (let c = 0; c < 3; c++) {
                const topLeft = originalData[(y1 * width + x1) * 4 + c];
                const topRight = originalData[(y1 * width + x2) * 4 + c];
                const bottomLeft = originalData[(y2 * width + x1) * 4 + c];
                const bottomRight = originalData[(y2 * width + x2) * 4 + c];

                const top = topLeft * (1 - fracX) + topRight * fracX;
                const bottom = bottomLeft * (1 - fracX) + bottomRight * fracX;

                newData[index + c] = Math.round(top * (1 - fracY) + bottom * fracY);
            }
            newData[index + 3] = 255; // Alpha channel
        }
    }

    // Apply a subtle sharpening to enhance details
    for (let y = 1; y < newHeight - 1; y++) {
        for (let x = 1; x < newWidth - 1; x++) {
            const index = (y * newWidth + x) * 4;
            for (let c = 0; c < 3; c++) {
                const current = newData[index + c];
                const neighbors =
                    newData[((y-1) * newWidth + x) * 4 + c] +
                    newData[((y+1) * newWidth + x) * 4 + c] +
                    newData[(y * newWidth + x - 1) * 4 + c] +
                    newData[(y * newWidth + x + 1) * 4 + c];
                const sharpened = current * 5 - neighbors;
                newData[index + c] = Math.min(255, Math.max(0, Math.round(current * 0.8 + sharpened * 0.2)));
            }
        }
    }

    ctx.canvas.width = newWidth;
    ctx.canvas.height = newHeight;
    ctx.putImageData(newImageData, 0, 0);
}
function applyGaussianBlur(ctx, width, height, radius = 2) {
    const imageData = ctx.getImageData(0, 0, width, height);
    const data = imageData.data;
    const tempData = new Uint8ClampedArray(data);

    // Generuj tablicę wag dla rozmycia Gaussa
    const weights = [];
    let sum = 0;
    for (let i = -radius; i <= radius; i++) {
        const weight = Math.exp(-(i * i) / (2 * radius * radius));
        weights.push(weight);
        sum += weight;
    }
    // Normalizuj wagi
    for (let i = 0; i < weights.length; i++) {
        weights[i] /= sum;
    }

    // Zastosuj rozmycie w poziomie
    for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
            let r = 0, g = 0, b = 0;
            for (let i = -radius; i <= radius; i++) {
                const xi = Math.min(Math.max(x + i, 0), width - 1);
                const idx = (y * width + xi) * 4;
                const weight = weights[i + radius];
                r += tempData[idx] * weight;
                g += tempData[idx + 1] * weight;
                b += tempData[idx + 2] * weight;
            }
            const idx = (y * width + x) * 4;
            data[idx] = r;
            data[idx + 1] = g;
            data[idx + 2] = b;
        }
    }

    // Zastosuj rozmycie w pionie
    tempData.set(data);
    for (let x = 0; x < width; x++) {
        for (let y = 0; y < height; y++) {
            let r = 0, g = 0, b = 0;
            for (let i = -radius; i <= radius; i++) {
                const yi = Math.min(Math.max(y + i, 0), height - 1);
                const idx = (yi * width + x) * 4;
                const weight = weights[i + radius];
                r += tempData[idx] * weight;
                g += tempData[idx + 1] * weight;
                b += tempData[idx + 2] * weight;
            }
            const idx = (y * width + x) * 4;
            data[idx] = r;
            data[idx + 1] = g;
            data[idx + 2] = b;
        }
    }

    ctx.putImageData(imageData, 0, 0);
}
function applyAdaptiveSharpening(ctx, width, height, amount = 0.5) {
    const imageData = ctx.getImageData(0, 0, width, height);
    const data = imageData.data;
    const tempData = new Uint8ClampedArray(data);

    for (let y = 1; y < height - 1; y++) {
        for (let x = 1; x < width - 1; x++) {
            const i = (y * width + x) * 4;
            for (let c = 0; c < 3; c++) {
                const current = tempData[i + c];
                const neighbors = [
                    tempData[i - width * 4 + c],
                    tempData[i + width * 4 + c],
                    tempData[i - 4 + c],
                    tempData[i + 4 + c]
                ];
                const diff = Math.max(...neighbors.map(n => Math.abs(current - n)));
                const factor = Math.min(1, diff / 20) * amount;
                const sharpened = current * (1 + 4 * factor) - neighbors.reduce((a, b) => a + b) * factor;
                data[i + c] = Math.min(255, Math.max(0, sharpened));
            }
        }
    }

    ctx.putImageData(imageData, 0, 0);
}
function applyEdgeSmoothing(ctx, width, height) {
    const imageData = ctx.getImageData(0, 0, width, height);
    const data = imageData.data;
    const tempData = new Uint8ClampedArray(data);

    for (let y = 1; y < height - 1; y++) {
        for (let x = 1; x < width - 1; x++) {
            const i = (y * width + x) * 4;
            for (let c = 0; c < 3; c++) {
                const sum =
                    tempData[i - width * 4 - 4 + c] +
                    tempData[i - width * 4 + c] +
                    tempData[i - width * 4 + 4 + c] +
                    tempData[i - 4 + c] +
                    tempData[i + c] +
                    tempData[i + 4 + c] +
                    tempData[i + width * 4 - 4 + c] +
                    tempData[i + width * 4 + c] +
                    tempData[i + width * 4 + 4 + c];
                data[i + c] = Math.round(sum / 9);
            }
        }
    }

    ctx.putImageData(imageData, 0, 0);
}
function applyLightBasedEdgeDetection(ctx, width, height, strength = 0.5) {
    const imageData = ctx.getImageData(0, 0, width, height);
    const data = imageData.data;
    const tempData = new Uint8ClampedArray(data);

    function getLuminance(r, g, b) {
        return 0.299 * r + 0.587 * g + 0.114 * b;
    }

    for (let y = 1; y < height - 1; y++) {
        for (let x = 1; x < width - 1; x++) {
            const i = (y * width + x) * 4;

            // Oblicz luminancję dla piksela centralnego i jego sąsiadów
            const luminance = getLuminance(tempData[i], tempData[i+1], tempData[i+2]);
            const luminanceTop = getLuminance(tempData[i - width * 4], tempData[i - width * 4 + 1], tempData[i - width * 4 + 2]);
            const luminanceBottom = getLuminance(tempData[i + width * 4], tempData[i + width * 4 + 1], tempData[i + width * 4 + 2]);
            const luminanceLeft = getLuminance(tempData[i - 4], tempData[i - 3], tempData[i - 2]);
            const luminanceRight = getLuminance(tempData[i + 4], tempData[i + 5], tempData[i + 6]);

            // Oblicz gradient w pionie i poziomie
            const gradientY = luminanceBottom - luminanceTop;
            const gradientX = luminanceRight - luminanceLeft;

            // Oblicz magnitude gradientu
            const gradientMagnitude = Math.sqrt(gradientX * gradientX + gradientY * gradientY);

            // Normalizuj magnitude do zakresu 0-1
            const normalizedMagnitude = Math.min(1, gradientMagnitude / 255);

            // Zastosuj wzmocnienie krawędzi bazując na gradiencie
            for (let c = 0; c < 3; c++) {
                const edgeStrength = normalizedMagnitude * strength;
                const originalColor = tempData[i + c];
                const enhancedColor = originalColor * (1 + edgeStrength);
                data[i + c] = Math.min(255, Math.max(0, Math.round(enhancedColor)));
            }
        }
    }

    ctx.putImageData(imageData, 0, 0);
}
